<!doctype html>
<!-- data-theme picks the active scheme from theme.muten (dark | light). It's the default; toggle it at runtime
     to switch themes (a theme.store + a `use` fn that sets document.documentElement.dataset.theme). -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero — without it an installed app is
       letterboxed on a notched phone. public/manifest.webmanifest makes this page installable (open it on a
       phone, then Chrome ▸ Install) and is also what `bubblewrap init --manifest=<url>` reads to build an .apk:
       edit the name/icon/theme_color there. `muten dev` prints a /_qr page to open this on a phone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- iOS Safari ignores most of the manifest, so "Add to Home Screen" needs its own tags: standalone (no URL
       bar), a title, and an apple-touch-icon (Safari won't use the manifest's PNG). This is the free, no-Mac,
       no-App-Store way to install on an iPhone — the Apple counterpart to the manifest's Android install. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muten">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <title>Muten app</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app.muten"></script>
</body>
</html>
